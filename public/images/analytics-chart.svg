<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <!-- Background -->
  <rect width="800" height="400" fill="#F9FAFB" rx="16"/>
  <!-- Chart area -->
  <rect x="60" y="40" width="680" height="320" rx="12" fill="#fff" stroke="#E5E7EB" stroke-width="1"/>
  <!-- Y-axis labels -->
  <text x="80" y="80" font-family="system-ui" font-size="10" fill="#9CA3AF">100%</text>
  <text x="80" y="140" font-family="system-ui" font-size="10" fill="#9CA3AF">75%</text>
  <text x="80" y="200" font-family="system-ui" font-size="10" fill="#9CA3AF">50%</text>
  <text x="80" y="260" font-family="system-ui" font-size="10" fill="#9CA3AF">25%</text>
  <text x="80" y="320" font-family="system-ui" font-size="10" fill="#9CA3AF">0%</text>
  <!-- Grid lines -->
  <line x1="120" y1="76" x2="720" y2="76" stroke="#F3F4F6" stroke-width="1"/>
  <line x1="120" y1="136" x2="720" y2="136" stroke="#F3F4F6" stroke-width="1"/>
  <line x1="120" y1="196" x2="720" y2="196" stroke="#F3F4F6" stroke-width="1"/>
  <line x1="120" y1="256" x2="720" y2="256" stroke="#F3F4F6" stroke-width="1"/>
  <line x1="120" y1="316" x2="720" y2="316" stroke="#F3F4F6" stroke-width="1"/>
  <!-- X-axis labels -->
  <text x="160" y="345" font-family="system-ui" font-size="10" fill="#9CA3AF" text-anchor="middle">Jan</text>
  <text x="260" y="345" font-family="system-ui" font-size="10" fill="#9CA3AF" text-anchor="middle">Feb</text>
  <text x="360" y="345" font-family="system-ui" font-size="10" fill="#9CA3AF" text-anchor="middle">Mar</text>
  <text x="460" y="345" font-family="system-ui" font-size="10" fill="#9CA3AF" text-anchor="middle">Apr</text>
  <text x="560" y="345" font-family="system-ui" font-size="10" fill="#9CA3AF" text-anchor="middle">Maj</text>
  <text x="660" y="345" font-family="system-ui" font-size="10" fill="#9CA3AF" text-anchor="middle">Jun</text>
  <!-- Area chart - Acceptance rate -->
  <defs>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M160 256 L260 220 L360 196 L460 160 L560 136 L660 108 L660 316 L160 316 Z" fill="url(#areaGrad)"/>
  <path d="M160 256 L260 220 L360 196 L460 160 L560 136 L660 108" stroke="#818CF8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Data points -->
  <circle cx="160" cy="256" r="5" fill="#fff" stroke="#818CF8" stroke-width="2"/>
  <circle cx="260" cy="220" r="5" fill="#fff" stroke="#818CF8" stroke-width="2"/>
  <circle cx="360" cy="196" r="5" fill="#fff" stroke="#818CF8" stroke-width="2"/>
  <circle cx="460" cy="160" r="5" fill="#fff" stroke="#818CF8" stroke-width="2"/>
  <circle cx="560" cy="136" r="5" fill="#fff" stroke="#818CF8" stroke-width="2"/>
  <circle cx="660" cy="108" r="6" fill="#818CF8" stroke="#fff" stroke-width="2"/>
  <!-- Bar chart overlay - Sent quotes -->
  <rect x="140" y="236" width="40" height="80" rx="4" fill="#E0E7FF" opacity="0.6"/>
  <rect x="240" y="196" width="40" height="120" rx="4" fill="#E0E7FF" opacity="0.6"/>
  <rect x="340" y="176" width="40" height="140" rx="4" fill="#E0E7FF" opacity="0.6"/>
  <rect x="440" y="156" width="40" height="160" rx="4" fill="#E0E7FF" opacity="0.6"/>
  <rect x="540" y="136" width="40" height="180" rx="4" fill="#E0E7FF" opacity="0.6"/>
  <rect x="640" y="116" width="40" height="200" rx="4" fill="#C7D2FE" opacity="0.6"/>
  <!-- Tooltip -->
  <g filter="url(#tooltipShadow)">
    <rect x="610" y="56" width="120" height="52" rx="10" fill="#111827"/>
    <text x="630" y="76" font-family="system-ui" font-size="10" fill="#9CA3AF">Acceptansgrad</text>
    <text x="630" y="96" font-family="system-ui" font-size="16" font-weight="700" fill="#fff">87%</text>
    <text x="678" y="96" font-family="system-ui" font-size="10" fill="#4ADE80">↑ 12%</text>
  </g>
  <!-- Legend -->
  <circle cx="140" cy="56" r="4" fill="#818CF8"/>
  <text x="150" y="60" font-family="system-ui" font-size="10" fill="#6B7280">Acceptansgrad</text>
  <rect x="250" y="52" width="8" height="8" rx="2" fill="#E0E7FF"/>
  <text x="264" y="60" font-family="system-ui" font-size="10" fill="#6B7280">Skickade offerter</text>
  <defs>
    <filter id="tooltipShadow" x="598" y="48" width="144" height="76" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
</svg>
