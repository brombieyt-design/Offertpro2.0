<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <!-- Center hub -->
  <circle cx="400" cy="100" r="40" fill="#4F46E5" opacity="0.1" stroke="#818CF8" stroke-width="1.5"/>
  <text x="400" y="96" font-family="system-ui" font-size="10" font-weight="700" fill="#4F46E5" text-anchor="middle">OFFERT</text>
  <text x="400" y="110" font-family="system-ui" font-size="10" font-weight="300" fill="#818CF8" text-anchor="middle">PRO</text>

  <!-- Connection lines -->
  <line x1="360" y1="100" x2="200" y2="50" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="360" y1="100" x2="200" y2="150" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="440" y1="100" x2="600" y2="50" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="440" y1="100" x2="600" y2="150" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="400" y1="60" x2="400" y2="20" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="400" y1="140" x2="400" y2="180" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Fortnox -->
  <g>
    <rect x="140" y="24" width="120" height="48" rx="12" fill="#fff" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="156" y="38" width="20" height="20" rx="6" fill="#EEF2FF"/>
    <rect x="162" y="44" width="8" height="8" rx="1" fill="#818CF8"/>
    <text x="184" y="52" font-family="system-ui" font-size="11" font-weight="600" fill="#374151">Fortnox</text>
  </g>

  <!-- Swish/Stripe -->
  <g>
    <rect x="140" y="124" width="120" height="48" rx="12" fill="#fff" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="156" y="138" width="20" height="20" rx="6" fill="#FEF3C7"/>
    <text x="162" y="153" font-family="system-ui" font-size="10" fill="#F59E0B">kr</text>
    <text x="184" y="152" font-family="system-ui" font-size="11" font-weight="600" fill="#374151">Stripe</text>
  </g>

  <!-- Google Calendar -->
  <g>
    <rect x="340" y="-6" width="120" height="48" rx="12" fill="#fff" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="356" y="8" width="20" height="20" rx="6" fill="#DBEAFE"/>
    <text x="362" y="23" font-family="system-ui" font-size="10" fill="#3B82F6">31</text>
    <text x="384" y="22" font-family="system-ui" font-size="11" font-weight="600" fill="#374151">Calendar</text>
  </g>

  <!-- Gmail/E-post -->
  <g>
    <rect x="540" y="24" width="120" height="48" rx="12" fill="#fff" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="556" y="38" width="20" height="20" rx="6" fill="#FEE2E2"/>
    <text x="559" y="53" font-family="system-ui" font-size="10" fill="#EF4444">@</text>
    <text x="584" y="52" font-family="system-ui" font-size="11" font-weight="600" fill="#374151">Gmail</text>
  </g>

  <!-- Google Drive -->
  <g>
    <rect x="540" y="124" width="120" height="48" rx="12" fill="#fff" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="556" y="138" width="20" height="20" rx="6" fill="#DCFCE7"/>
    <path d="M562 152l4-8 4 8z" fill="#22C55E"/>
    <text x="584" y="152" font-family="system-ui" font-size="11" font-weight="600" fill="#374151">Drive</text>
  </g>

  <!-- BankID -->
  <g>
    <rect x="340" y="156" width="120" height="48" rx="12" fill="#fff" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="356" y="170" width="20" height="20" rx="6" fill="#EEF2FF"/>
    <path d="M362 177l3 3 5-6" stroke="#4F46E5" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="384" y="184" font-family="system-ui" font-size="11" font-weight="600" fill="#374151">BankID</text>
  </g>

  <!-- Animated dots on lines -->
  <circle r="3" fill="#818CF8" opacity="0.6">
    <animateMotion dur="3s" repeatCount="indefinite" path="M360 100 L200 50"/>
  </circle>
  <circle r="3" fill="#818CF8" opacity="0.6">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M440 100 L600 150"/>
  </circle>
  <circle r="3" fill="#818CF8" opacity="0.6">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M400 60 L400 20"/>
  </circle>
</svg>
